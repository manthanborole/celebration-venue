<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Celebrations | Lawn & Banquet Halls</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), 
                        url('https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            color: #fff;
            padding: 100px 0;
        }
        .venue-card:hover { transform: translateY(-5px); transition: 0.2s; }
        .admin-controls { display: none; } 
    </style>
</head>
<body class="bg-light">

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-stars text-warning me-2"></i>Grand Celebrations</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#venues">Venues</a></li>
                    <li class="nav-item"><a class="nav-link" href="#log-event">Log Event</a></li>
                    <li class="nav-item"><a class="nav-link" href="#logged-events">Records</a></li>
                    <li class="nav-item">
                        <a class="nav-link text-warning fw-bold" href="#" id="adminToggleBtn" onclick="toggleAdmin()">Admin Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero-section text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">Celebrate Your Special Moments</h1>
            <p class="lead">Open Celebration Lawn • 2 Banquet Halls • Dedicated Dining Space</p>
            <a href="#log-event" class="btn btn-warning btn-lg mt-3 fw-semibold">Log Your Event</a>
        </div>
    </header>

    <!-- Event Logging Form -->
    <section class="container my-5" id="log-event">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white py-3">
                        <h4 class="mb-0 text-center"><i class="bi bi-journal-plus me-2"></i>Log an Event</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="eventForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Host Name</label>
                                    <input type="text" id="hostName" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Contact Number</label>
                                    <input type="tel" id="contactNumber" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Venue Required</label>
                                    <select id="venueChoice" class="form-select" required>
                                        <option value="" disabled selected>Select Venue</option>
                                        <option value="Celebration Lawn">Celebration Lawn</option>
                                        <option value="Celebration Hall 1">Celebration Hall 1</option>
                                        <option value="Celebration Hall 2">Celebration Hall 2</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Event Date</label>
                                    <input type="date" id="eventDate" class="form-control" required>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-success w-100 py-2 fs-5 fw-semibold">Submit Event Entry</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Logged Events Table Section -->
    <section class="container my-5" id="logged-events">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0"><i class="bi bi-calendar-check me-2"></i>Logged Events</h5>
                <button id="clearAllBtn" class="btn btn-sm btn-danger admin-controls" onclick="clearAllEvents()">
                    <i class="bi bi-trash"></i> Clear All
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Host Name</th>
                                <th>Contact</th>
                                <th>Venue</th>
                                <th>Date</th>
                                <th class="admin-controls">Admin Action</th>
                            </tr>
                        </thead>
                        <tbody id="eventsTableBody">
                            <!-- Injected by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <!-- JavaScript & Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwuUcOhdSBDwYI-8hk9Iq899k8SLAw0SI",
            authDomain: "celebrationvenues.firebaseapp.com",
            projectId: "celebrationvenues",
            storageBucket: "celebrationvenues.firebasestorage.app",
            messagingSenderId: "913844439477",
            appId: "1:913844439477:web:9bffc421c18ac10397f1fc",
            measurementId: "G-J8D421EZ7N"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        const eventsCollection = collection(db, "events");

        const ADMIN_PASSWORD = "admin";
        let isAdminLoggedIn = false;

        window.toggleAdmin = function() {
            if (isAdminLoggedIn) {
                isAdminLoggedIn = false;
                document.getElementById("adminToggleBtn").innerHTML = "Admin Login";
                document.getElementById("adminToggleBtn").classList.replace("text-danger", "text-warning");
                alert("Logged out of Admin Mode.");
            } else {
                const pass = prompt("Enter Admin Password to manage events:");
                if (pass === ADMIN_PASSWORD) {
                    isAdminLoggedIn = true;
                    document.getElementById("adminToggleBtn").innerHTML = "<i class='bi bi-unlock'></i> Exit Admin";
                    document.getElementById("adminToggleBtn").classList.replace("text-warning", "text-danger");
                    alert("Admin Access Granted.");
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            }
            toggleAdminUI();
            renderTable(); 
        };

        function toggleAdminUI() {
            const adminElements = document.querySelectorAll('.admin-controls');
            adminElements.forEach(el => {
                el.style.display = isAdminLoggedIn ? 'table-cell' : 'none';
            });
            document.getElementById('clearAllBtn').style.display = isAdminLoggedIn ? 'block' : 'none';
        }

        const form = document.getElementById("eventForm");
        
        // Safety check added here just in case!
        if (form) {
            form.addEventListener("submit", async function(e) {
                e.preventDefault();
                try {
                    await addDoc(eventsCollection, {
                        hostName: document.getElementById("hostName").value,
                        contactNumber: document.getElementById("contactNumber").value,
                        venueChoice: document.getElementById("venueChoice").value,
                        eventDate: document.getElementById("eventDate").value,
                        timestamp: Date.now()
                    });
                    
                    form.reset();
                    alert("Event successfully logged!");
                } catch (error) {
                    console.error("Error adding document: ", error);
                    alert("Error logging event. Check console.");
                }
            });
        }

        let currentEvents = []; 
        
        onSnapshot(eventsCollection, (snapshot) => {
            currentEvents = [];
            snapshot.forEach((doc) => {
                currentEvents.push({ id: doc.id, ...doc.data() });
            });
            
            currentEvents.sort((a, b) => a.timestamp - b.timestamp);
            renderTable();
        });

        function renderTable() {
            const tbody = document.getElementById("eventsTableBody");
            if (!tbody) return; // Safety check
            
            tbody.innerHTML = "";

            if (currentEvents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">No events logged yet.</td></tr>`;
                return;
            }

            currentEvents.forEach((evt, idx) => {
                const tr = document.createElement("tr");
                let rowHTML = `
                    <td>${idx + 1}</td>
                    <td><strong>${escapeHtml(evt.hostName)}</strong></td>
                    <td>${escapeHtml(evt.contactNumber)}</td>
                    <td><span class="badge bg-primary">${escapeHtml(evt.venueChoice)}</span></td>
                    <td>${escapeHtml(evt.eventDate)}</td>
                `;
                
                if (isAdminLoggedIn) {
                    rowHTML += `<td>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteSingleEvent('${evt.id}')">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </td>`;
                }

                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });
        }

        window.deleteSingleEvent = async function(docId) {
            if (!isAdminLoggedIn) return;
            if (confirm("Are you sure you want to delete this specific event?")) {
                await deleteDoc(doc(db, "events", docId));
            }
        };

        window.clearAllEvents = async function() {
            if (!isAdminLoggedIn) return;
            if (confirm("WARNING: Are you sure you want to clear ALL logged event records?")) {
                currentEvents.forEach(async (evt) => {
                    await deleteDoc(doc(db, "events", evt.id));
                });
            }
        };

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
