<script type="module">
    // 1. Import Firebase modules from the CDN (Using full URLs for the browser)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-analytics.js";
    
    // MISSING: You need to import the database (Firestore) functions!
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 2. PASTE YOUR FIREBASE CONFIG HERE
    const firebaseConfig = {
        apiKey: "AIzaSyAwuUcOhdSBDwYI-8hk9Iq899k8SLAw0SI",
        authDomain: "celebrationvenues.firebaseapp.com",
        projectId: "celebrationvenues",
        storageBucket: "celebrationvenues.firebasestorage.app",
        messagingSenderId: "913844439477",
        appId: "1:913844439477:web:9bffc421c18ac10397f1fc",
        measurementId: "G-J8D421EZ7N"
    };

    // 3. Initialize Firebase, Analytics, AND Firestore
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    
    // MISSING: You must initialize the database connection
    const db = getFirestore(app);
    const eventsCollection = collection(db, "events");

    // Admin Configuration
    const ADMIN_PASSWORD = "admin";
    let isAdminLoggedIn = false;

    // Make functions globally available to the HTML buttons
    window.toggleAdmin = function() {
        if (isAdminLoggedIn) {
            isAdminLoggedIn = false;
            document.getElementById("adminToggleBtn").innerHTML = "Admin Login";
            document.getElementById("adminToggleBtn").classList.replace("text-danger", "text-warning");
            alert("Logged out of Admin Mode.");
        } else {
            const pass = prompt("Enter Admin Password to manage events:");
            if (pass === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                document.getElementById("adminToggleBtn").innerHTML = "<i class='bi bi-unlock'></i> Exit Admin";
                document.getElementById("adminToggleBtn").classList.replace("text-warning", "text-danger");
                alert("Admin Access Granted. You can now delete events.");
            } else if (pass !== null) {
                alert("Incorrect Password!");
            }
        }
        toggleAdminUI();
        renderTable(); 
    };

    function toggleAdminUI() {
        const adminElements = document.querySelectorAll('.admin-controls');
        adminElements.forEach(el => {
            el.style.display = isAdminLoggedIn ? 'table-cell' : 'none';
        });
        document.getElementById('clearAllBtn').style.display = isAdminLoggedIn ? 'block' : 'none';
    }

    // 4. Handle Form Submission
    const form = document.getElementById("eventForm");
    form.addEventListener("submit", async function(e) {
        e.preventDefault();
        
        try {
            // Save to Firebase
            await addDoc(eventsCollection, {
                hostName: document.getElementById("hostName").value,
                contactNumber: document.getElementById("contactNumber").value,
                venueChoice: document.getElementById("venueChoice").value,
                eventDate: document.getElementById("eventDate").value,
                timestamp: Date.now() // Used for sorting
            });
            
            form.reset();
            alert("Event successfully logged!");
        } catch (error) {
            console.error("Error adding document: ", error);
            alert("Error logging event. Check console.");
        }
    });

    // 5. Listen for Real-Time Updates from Firebase
    let currentEvents = []; 
    
    onSnapshot(eventsCollection, (snapshot) => {
        currentEvents = [];
        snapshot.forEach((doc) => {
            currentEvents.push({ id: doc.id, ...doc.data() });
        });
        
        currentEvents.sort((a, b) => a.timestamp - b.timestamp);
        renderTable();
    });

    // 6. Render Table
    function renderTable() {
        const tbody = document.getElementById("eventsTableBody");
        tbody.innerHTML = "";

        if (currentEvents.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-3">No events logged yet.</td></tr>`;
            return;
        }

        currentEvents.forEach((evt, idx) => {
            const tr = document.createElement("tr");
            let rowHTML = `
                <td>${idx + 1}</td>
                <td><strong>${escapeHtml(evt.hostName)}</strong></td>
                <td>${escapeHtml(evt.contactNumber)}</td>
                <td><span class="badge bg-primary">${escapeHtml(evt.venueChoice)}</span></td>
                <td>${escapeHtml(evt.eventDate)}</td>
            `;
            
            if (isAdminLoggedIn) {
                rowHTML += `<td>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteSingleEvent('${evt.id}')">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </td>`;
            }

            tr.innerHTML = rowHTML;
            tbody.appendChild(tr);
        });
    }

    // 7. Delete Single Event from Firebase
    window.deleteSingleEvent = async function(docId) {
        if (!isAdminLoggedIn) return;
        if (confirm("Are you sure you want to delete this specific event?")) {
            await deleteDoc(doc(db, "events", docId));
        }
    };

    // 8. Clear All 
    window.clearAllEvents = async function() {
        if (!isAdminLoggedIn) return;
        if (confirm("WARNING: Are you sure you want to clear ALL logged event records?")) {
            currentEvents.forEach(async (evt) => {
                await deleteDoc(doc(db, "events", evt.id));
            });
        }
    };

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.innerText = text;
        return div.innerHTML;
    }
</script>
